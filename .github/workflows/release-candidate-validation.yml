name: Temporary D1 performance release candidate checks

on:
  push:
    branches:
      - ops/validate-spine-20261114-d1-perf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/benchmark-language.mjs
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: node scripts/verify-versioned-frontend.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4==4.13.4'
      - run: python -m unittest discover -s tests -p 'test_spine_discovery.py' -v


      - name: Install browser for list return regression
        run: |
          npm install --prefix "$RUNNER_TEMP/spine-navigation" --no-package-lock --no-save --ignore-scripts playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/spine-navigation/node_modules/playwright/cli.js" install --with-deps chromium
          fi
          echo "PW_MODULE=$RUNNER_TEMP/spine-navigation/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify list position and deployed Preview (read-only)
        env:
          PREVIEW_URL: https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev
        run: node tests/navigation.browser.mjs
