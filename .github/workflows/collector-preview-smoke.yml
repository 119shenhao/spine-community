name: Preview collector safe smoke
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/collector-preview-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check isolated preview and collector authorization (no write requests)
        shell: bash
        run: |
          set -euo pipefail
          base='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          ready=0
          for i in $(seq 1 24); do
            health=$(curl -sS --connect-timeout 5 --max-time 20 "$base/api/health" || true)
            collect_code=$(curl -sS --connect-timeout 5 --max-time 20 -o collect.json -w '%{http_code}' "$base/api/collect/exclusions?site=tieba" || true)
            if echo "$health" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("databaseReady") is True and d.get("importEnabled") is True'; then
              if [[ "$collect_code" == 401 || "$collect_code" == 503 ]]; then
                if python3 - <<'PY'
import json
d=json.load(open('collect.json'))
assert d.get('error') in ('collector_unauthorized','collect_secret_not_configured'),d
print('Expected collector protection:',d['error'])
PY
                then ready=1; break; fi
              fi
            fi
            echo "Waiting for collector deployment; attempt $i, response status=$collect_code"
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo "Preview collector endpoint not ready/secure after polling" >&2
            exit 1
          fi
          echo "Preview health and unauthenticated collector refusal passed. No content or tokens were written."
