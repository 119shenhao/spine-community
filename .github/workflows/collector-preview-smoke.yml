name: Preview collector keyless read-only smoke
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/collector-preview-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify preview works without API key and remains read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          ready=0
          for i in $(seq 1 24); do
            curl -sS --connect-timeout 5 --max-time 20 -o health.json "$base/api/health" || true
            collect_code=$(curl -sS --connect-timeout 5 --max-time 20 -o collect.json -w '%{http_code}' "$base/api/collect/exclusions?site=tieba" || true)
            if [[ "$collect_code" == 200 ]]; then
              if python3 -c 'import json; h=json.load(open("health.json")); c=json.load(open("collect.json")); assert h.get("databaseReady") is True and h.get("importEnabled") is True; assert c.get("site")=="tieba" and isinstance(c.get("items"),list) and "next_cursor" in c; print("Preview keyless collection exclusions returned HTTP 200")'; then
                ready=1
                break
              fi
            fi
            echo "Waiting for keyless preview deployment: attempt $i; code=$collect_code"
            sleep 5
          done
          if [[ "$ready" != 1 ]]; then
            echo "Keyless preview collector endpoint was not ready after polling" >&2
            exit 1
          fi
          echo "Preview read-only smoke passed. No content was written."
