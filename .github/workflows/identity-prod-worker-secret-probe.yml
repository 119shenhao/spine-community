name: Identity Center production Worker secret capability (read-only)
on:
  push:
    branches: [release/identity-center-prod-20261121]
    paths:
      - .github/workflows/identity-prod-worker-secret-probe.yml

permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_D1_API_TOKEN }}
    steps:
      - name: Check whether existing Cloudflare token can manage Worker Secret names
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not token: raise SystemExit("Production Cloudflare GitHub secret missing")
          url="https://api.cloudflare.com/client/v4/accounts/289976272520a38732bef34108585e11/workers/scripts/spine-community/secrets"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"},method="GET")
          try:
            with urllib.request.urlopen(req,timeout=20) as resp:
              data=json.load(resp)
            if not data.get("success"): raise SystemExit("Cloudflare Worker secret metadata access rejected")
            result=data.get("result",[])
            names={item.get("name") for item in result if isinstance(item,dict)}
            print("Worker secret-list access OK; GOOGLE_CLIENT_SECRET present:", "GOOGLE_CLIENT_SECRET" in names)
            print("Worker secret-list access OK; IDENTITY_CLIENT_SECRET present:", "IDENTITY_CLIENT_SECRET" in names)
          except urllib.error.HTTPError as exc:
            print("Existing token cannot inspect Worker secrets: HTTP",exc.code)
            raise SystemExit(2)
          PY
