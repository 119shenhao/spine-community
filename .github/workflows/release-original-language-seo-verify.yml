name: Release candidate original language SEO checks
on:
  push:
    branches:
      - release/original-language-seo-20261110
    paths:
      - .github/workflows/release-original-language-seo-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/benchmark-language.mjs
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: node scripts/verify-versioned-frontend.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4==4.13.4'
      - run: python -m unittest discover -s tests -p 'test_spine_discovery.py' -v
