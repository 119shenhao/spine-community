name: Spine Community feature checks

on:
  push:
    branches:
      - feature/v1-community-build-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/benchmark-language.mjs
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: node scripts/verify-versioned-frontend.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4==4.13.4'
      - run: python -m unittest discover -s tests -p 'test_spine_discovery.py' -v
