name: Isolated ARM64 compatibility
on:
  push:
    branches: [test/arm64-compat-20261124]
    paths: [.github/workflows/arm64-compat-test.yml]
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify architecture
        run: |
          uname -m
          test "$(uname -m)" = aarch64
          python --version
          node --version
          node -e "if(process.arch !== 'arm64') process.exit(1)"
      - name: Offline collector tests
        run: |
          python -m pip install 'beautifulsoup4==4.13.4'
          python -m unittest discover -s tests -p 'test_spine_discovery.py' -v
      - name: Chromium ARM64 offline smoke
        run: |
          python -m pip install 'playwright==1.54.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.set_content('<h1>ARM64 OK</h1>')
              assert page.locator('h1').inner_text() == 'ARM64 OK'
              browser.close()
          print('Chromium ARM64 PASS')
          PY
      - name: Development dependencies and offline verification
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          npm run db:local
      - uses: actions/checkout@v4
        with:
          ref: f529f3b3ac913a409577de96a68c56f0811b7e8b
          path: pinned-sync
          persist-credentials: false
      - name: Pinned sync source offline verification
        working-directory: pinned-sync
        run: |
          git rev-parse HEAD
          npm ci --no-audit --no-fund
          npm run verify
          npm run db:local
          ./node_modules/.bin/wrangler --version
