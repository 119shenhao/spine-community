name: Preview Azure translation
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/preview-azure-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spine-preview-azure-translation
jobs:
  smoke:
    if: github.ref == 'refs/heads/feature/v1-community-build-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Azure and enable translation in Preview D1
        env:
          CLOUDFLARE_ACCOUNT_ID: '289976272520a38732bef34108585e11'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          import {readFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {setTimeout as delay} from 'node:timers/promises';

          const preview='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev';
          const config='wrangler.preview-migrations.jsonc';
          const [db,...others]=JSON.parse(readFileSync(config,'utf8')).d1_databases;
          assert.equal(others.length,0);
          assert.equal(db.binding,'PREVIEW_DB');
          assert.equal(db.database_id,'4362537a-5748-4a05-b0c4-219c3db36996');
          assert(process.env.CLOUDFLARE_API_TOKEN,'Preview D1 token is required');
          const sql=statement=>{
            try {
              return JSON.parse(execFileSync(process.execPath,[
                'node_modules/wrangler/bin/wrangler.js','d1','execute','PREVIEW_DB',
                '--remote','--config',config,'--command',statement,'--json'
              ],{encoding:'utf8',stdio:['ignore','pipe','pipe']})).flatMap(result=>result.results||[]);
            } catch {
              throw new Error('Preview D1 command failed');
            }
          };
          const health=()=>fetch(preview+'/api/health',{signal:AbortSignal.timeout(8000),redirect:'error'})
            .then(response=>response.ok?response.json():null).catch(()=>null);
          const initial=await health();
          assert.equal(initial?.environment,'preview');
          assert.equal(initial?.translationReady,true);

          const setting=sql("SELECT value FROM settings WHERE key='translation_enabled'")[0]?.value;
          assert(['false','true'].includes(setting),'Preview translation setting is missing');
          const actor=randomUUID(),topic=randomUUID();
          const item={type:'topic',id:topic,scope:'full',version:1};
          const read=async(generate,locale='fr')=>{
            const response=await fetch(preview+'/api/translate',{
              method:'POST',headers:{origin:preview,'content-type':'application/json'},redirect:'error',
              signal:AbortSignal.timeout(20000),body:JSON.stringify({locale,generate,items:[item]})
            });
            assert.equal(response.status,200,'Unexpected Preview API status');
            return (await response.json()).items[0];
          };
          let passed=false,fixtureStarted=false;
          try{
            if(setting==='false')sql("UPDATE settings SET value='true' WHERE key='translation_enabled' AND value='false'");
            let live;
            for(let attempt=0;attempt<24;attempt++){
              live=await health();
              if(live?.environment==='preview'&&live.translationConfigured===true)break;
              await delay(8000);
            }
            assert.equal(live?.translationConfigured,true,'Preview Worker switch, key, region, endpoint or F0 verification timestamp is missing or invalid');
            fixtureStarted=true;
            sql("INSERT INTO users(id,nickname) VALUES('"+actor+"','Azure smoke fixture'); "+
              "INSERT INTO topics(id,author_id,title,body,source_lang,source_lang_mode,status) "+
              "VALUES('"+topic+"','"+actor+"','Fictional translation check','This fictional fixture has a blue chair and no personal information.','en','manual','pending_review'); "+
              "INSERT INTO topic_sync_receipts(source_topic_id,production_topic_id,content_hash) "+
              "VALUES('"+topic+"','preview-only-azure-smoke','"+"0".repeat(64)+"'); "+
              "UPDATE topics SET status='published' WHERE id='"+topic+"'");
            assert.equal((await read(false)).reason,'translation_cache_miss');
            assert.equal((await read(true,'en')).reason,'same_language');
            const translation=await read(true);
            assert.equal(translation.translated,true,'Azure failed: '+(translation.reason||'unknown'));
            assert.equal(translation.provider,'azure');
            assert(translation.body&&translation.body!=='This fictional fixture has a blue chair and no personal information.');
            const cached=await read(false);
            assert.equal(cached.body,translation.body);
            const provenance=sql("SELECT provider,product_id,engine_type,source_language,locale,source_version FROM topic_translations "+
              "WHERE topic_id='"+topic+"' AND scope='full'")[0];
            assert.deepEqual(provenance,{provider:'azure',product_id:'azure_ai_translator_text',engine_type:'nmt',
              source_language:'en',locale:'fr',source_version:1});
            sql("UPDATE topics SET status='hidden' WHERE id='"+topic+"'");
            assert.equal((await read(false)).reason,'not_found');
            passed=true;
          } finally {
            try {
              if(fixtureStarted)sql("DELETE FROM topics WHERE id='"+topic+"'; DELETE FROM users WHERE id='"+actor+"'");
            } catch(error) {
              passed=false;
              throw error;
            } finally {
              if(!passed&&setting==='false')sql("UPDATE settings SET value='false' WHERE key='translation_enabled'");
            }
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Preview only: real Azure NMT, cold read, same-language skip, D1 cache and provenance, withdrawal and fixture cleanup passed. Translation remains enabled.\n');
          JS
