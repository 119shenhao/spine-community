name: Preview Azure translation
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/preview-azure-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spine-preview-azure-translation
jobs:
  smoke:
    if: github.ref == 'refs/heads/feature/v1-community-build-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Azure and enable translation in Preview D1
        env:
          CLOUDFLARE_ACCOUNT_ID: '289976272520a38732bef34108585e11'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {randomUUID,createHash} from 'node:crypto';
          import {readFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {setTimeout as delay} from 'node:timers/promises';
          import {unpackTranslation,translationView} from './public/translation-ui.js';
          import {publicContentReader} from './public/public-content.js';

          const preview='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev';
          const cdn='https://spine-data-dev.nbn369.com';
          const config='wrangler.preview-migrations.jsonc';
          const [db,...others]=JSON.parse(readFileSync(config,'utf8')).d1_databases;
          assert.equal(others.length,0);
          assert.equal(db.binding,'PREVIEW_DB');
          assert.equal(db.database_id,'4362537a-5748-4a05-b0c4-219c3db36996');
          assert(process.env.CLOUDFLARE_API_TOKEN,'Preview D1 token is required');
          const sql=statement=>{
            try {
              return JSON.parse(execFileSync(process.execPath,[
                'node_modules/wrangler/bin/wrangler.js','d1','execute','PREVIEW_DB',
                '--remote','--config',config,'--command',statement,'--json'
              ],{encoding:'utf8',stdio:['ignore','pipe','pipe']})).flatMap(result=>result.results||[]);
            } catch {
              throw new Error('Preview D1 command failed');
            }
          };
          const health=()=>fetch(preview+'/api/health',{signal:AbortSignal.timeout(8000),redirect:'error'})
            .then(response=>response.ok?response.json():null).catch(()=>null);
          const initial=await health();
          assert.equal(initial?.environment,'preview');
          assert.equal(initial?.translationReady,true);
          assert.equal(initial?.publicContent?.baseUrl,cdn);
          assert.equal(initial?.publicContent?.onDemand,true);

          const setting=sql("SELECT value FROM settings WHERE key='translation_enabled'")[0]?.value;
          assert(['false','true'].includes(setting),'Preview translation setting is missing');
          const actor=randomUUID(),topic=randomUUID();
          const query='?purge-smoke=1',editedQuery='?purge-smoke=2';
          const original='This fictional fixture has a blue chair and no personal information.';
          const edited='This fictional fixture now has a green chair and no personal information.';
          const page='topics/'+topic+'/detail.json';
          const item={type:'topic',id:topic,scope:'full',version:1,page};
          const read=async(generate,locale='fr',token,project=true)=>{
            const response=await fetch(preview+'/api/translate',{
              method:'POST',headers:{origin:preview,'content-type':'application/json'},redirect:'error',
              signal:AbortSignal.timeout(20000),body:JSON.stringify({locale,generate,items:[{...item,token,page:project?item.page:undefined}]})
            });
            assert.equal(response.status,200,'Unexpected Preview API status');
            return (await response.json()).items[0];
          };
          const session=randomUUID()+randomUUID();
          const sessionHash=createHash('sha256').update(session).digest('hex');
          const wakeProjection=async()=>{
            const response=await fetch(preview+'/api/me',{
              method:'PATCH',headers:{origin:preview,cookie:'sc_session='+session,'content-type':'application/json'},
              redirect:'error',signal:AbortSignal.timeout(15000),body:JSON.stringify({nickname:'Azure smoke fixture',preferred_locale:'en'})
            });
            assert(response.ok,'Preview projection wake failed');
          };
          const cdnRead=async(query='')=>{
            const response=await fetch(cdn+'/'+page+query,{
              headers:{origin:preview},redirect:'error',signal:AbortSignal.timeout(12000)
            });
            if(response.status===404)return {status:404};
            assert.equal(response.status,200,'Unexpected CDN status');
            assert.equal(response.headers.get('access-control-allow-origin'),preview);
            return {status:200,cache:response.headers.get('cf-cache-status'),age:response.headers.get('age'),
              control:response.headers.get('cache-control'),payload:await response.json()};
          };
          async function waitForCdn(accept,label,retry,query='') {
            let observed;
            for(let i=0;i<20;i++){
              observed=await cdnRead(query);
              if(accept(observed))return observed;
              if(retry&&i%3===2)await retry();
              await delay(1500);
            }
            const tasks=sql("SELECT p.state,p.last_error,p.published_version,d.pending,d.reserved,d.last_error demand_error "+
              "FROM public_projection p LEFT JOIN public_projection_demand d USING(scope,target) "+
              "WHERE p.scope='topic' AND p.target='"+topic+"'");
            const pending=sql("SELECT scope,state,count(*) n FROM public_projection WHERE state<>'done' GROUP BY scope,state");
            throw Error(label+' did not reach CDN: '+JSON.stringify({status:observed?.status,cache:observed?.cache,tasks,pending}));
          }
          let passed=false,fixtureStarted=false;
          try{
            if(setting==='false')sql("UPDATE settings SET value='true' WHERE key='translation_enabled' AND value='false'");
            let live;
            for(let attempt=0;attempt<24;attempt++){
              live=await health();
              if(live?.environment==='preview'&&live.version==='0.2.0-cdn-translation.2'&&live.translationConfigured===true)break;
              await delay(8000);
            }
            assert.equal(live?.version,'0.2.0-cdn-translation.2','The translation CDN build is not deployed');
            assert.equal(live?.translationConfigured,true,'Preview Worker switch, key, region, endpoint or F0 verification timestamp is missing or invalid');
            fixtureStarted=true;
            sql("INSERT INTO users(id,nickname) VALUES('"+actor+"','Azure smoke fixture'); "+
              "INSERT INTO user_sessions(id,user_id,token_hash,expires_at) VALUES('"+actor+"','"+actor+"','"+sessionHash+"',unixepoch()+600); "+
              "INSERT INTO topics(id,author_id,title,body,source_lang,source_lang_mode,status) "+
              "VALUES('"+topic+"','"+actor+"','Fictional translation check','"+original+"','en','manual','pending_review'); "+
              "INSERT INTO topic_sync_receipts(source_topic_id,production_topic_id,content_hash) "+
              "VALUES('"+topic+"','preview-only-azure-smoke','"+"0".repeat(64)+"'); "+
              "UPDATE topics SET status='published' WHERE id='"+topic+"'; "+
              "UPDATE public_projection SET priority=3 WHERE scope='topic' AND target='"+topic+"'");
            assert.equal((await cdnRead()).status,404);
            const requestOriginal=async()=>{
              const response=await fetch(preview+'/api/topics/'+topic,{
                headers:{'x-spine-projection-miss':page,cookie:'sc_session='+session},redirect:'error',signal:AbortSignal.timeout(12000)
              });
              assert.equal(response.status,200,'Preview original fallback failed');
              assert.equal((await response.json()).topic.id,topic);
            };
            await wakeProjection();
            await requestOriginal();
            const cold=await waitForCdn(result=>result.payload?.data?.topic?.id===topic,'Original projection',requestOriginal);
            assert.equal(cold.payload.data.topic.translations?.fr,undefined);
            assert.equal((await read(false)).reason,'translation_cache_miss');
            assert.equal((await read(true,'en')).reason,'same_language');
            const direct=live.publicContent.directTranslations===true;
            const translation=await read(true,'fr',undefined,!direct);
            assert.equal(translation.translated,true,'Azure failed: '+(translation.reason||'unknown'));
            assert.equal(translation.provider,'azure');
            assert(translation.body&&translation.body!==original);
            const cached=await read(false);
            assert.equal(cached.body,translation.body);
            const warm=await waitForCdn(result=>result.cache==='HIT'&&result.payload?.data?.topic?.translations?.fr,
              'Translation cache HIT',wakeProjection);
            const projected=warm.payload.data.topic.translations.fr;
            if(direct){
              assert.equal(projected.sourceVersion,1);
              assert.equal(projected.body,translation.body);
              assert.equal(projected.token,undefined);
              let calls=0;
              const view=translationView('fr',{direct:true,configured:true,hasCache:true,
                request:async()=>{calls++;throw Error('Unexpected Worker request');}});
              const row=warm.payload.data.topic;
              view.markPage({projectionKey:page,topic:row});
              await view.prime([['topic',row]]);
              assert.equal(view.item('topic',row).result.body,translation.body);
              assert.equal(calls,0);
              view.close();
              console.log('Real Azure translation returned as CDN HIT with zero translation Worker calls.');
            }else{
              assert(projected.ciphertext&&projected.token);
              const unlock=await read(false,'fr',projected.token);
              assert.equal((await unpackTranslation(unlock,projected)).body,translation.body);
            }
            for(const action of ['like','bookmark','follow']){
              const response=await fetch(preview+'/api/topics/'+topic+'/'+action,{
                method:'PUT',headers:{origin:preview,cookie:'sc_session='+session},signal:AbortSignal.timeout(10000)
              });
              assert.equal(response.status,200,'Fixture '+action+' failed');
            }
            const apiCalls=[];
            const memberReader=publicContentReader(live,{id:actor},async(path,options)=>{
              apiCalls.push(path);
              const response=await fetch(preview+path,{
                ...options,headers:{origin:preview,cookie:'sc_session='+session,'content-type':'application/json',...options?.headers}
              });
              assert.equal(response.status,200,'Signed-in viewer read failed');
              assert.equal(response.headers.get('cache-control'),'no-store');
              return response.json();
            },async(url,options)=>{
              assert.equal(url,cdn+'/'+page);
              assert.equal(options.credentials,'omit');
              return fetch(url,{...options,headers:{origin:preview}});
            });
            const member=await memberReader.topic(topic,new URLSearchParams());
            assert.equal(member.projectionKey,page);
            assert.equal(member.topic.author_id,actor);
            assert(member.topic.liked&&member.topic.bookmarked&&member.topic.followed);
            assert.deepEqual(member.topic.translations.fr,projected);
            assert.deepEqual(apiCalls,['/api/public-content/viewer']);
            console.log('Signed-in Preview reads used the shared CDN translation with separate no-store viewer state.');
            assert.match(warm.control||'',/s-maxage=7200\b/,'The R2 response must advertise a two-hour shared TTL');
            const warmVariant=async(label,search=query)=>waitForCdn(result=>result.cache==='HIT'&&
              result.payload?.data?.topic?.translations?.fr,label,wakeProjection,search);
            assert.deepEqual((await warmVariant('Translation cache HIT with query')).payload.data.topic.translations.fr,projected);
            const provenance=sql("SELECT provider,product_id,engine_type,source_language,locale,source_version FROM topic_translations "+
              "WHERE topic_id='"+topic+"' AND scope='full'")[0];
            assert.deepEqual(provenance,{provider:'azure',product_id:'azure_ai_translator_text',engine_type:'nmt',
              source_language:'en',locale:'fr',source_version:1});
            sql("UPDATE topics SET body='"+edited+"' WHERE id='"+topic+"'");
            await wakeProjection();
            const invalidated=result=>result.payload?.invalidated===true&&result.payload?.data?.topic===undefined;
            await waitForCdn(invalidated,'Edit invalidation of canonical URL',wakeProjection);
            await waitForCdn(invalidated,'Edit invalidation of query URL',wakeProjection,query);
            await requestOriginal();
            const editedHit=result=>result.cache==='HIT'&&result.payload?.data?.topic?.body===edited;
            const editedProjection=await waitForCdn(editedHit,'Edited canonical URL',requestOriginal);
            assert.equal(editedProjection.payload.data.topic.translations?.fr,undefined);
            assert.equal((await waitForCdn(editedHit,'Edited query URL',requestOriginal,query))
              .payload.data.topic.translations?.fr,undefined);
            item.version++;
            const editedTranslation=await read(true,'fr',undefined,!direct);
            assert.equal(editedTranslation.translated,true,'The edited fixture must have a new Azure translation');
            await waitForCdn(result=>result.cache==='HIT'&&result.payload?.data?.topic?.translations?.fr,
              'Edited translation cache HIT',wakeProjection);
            await warmVariant('Edited translation cache HIT with query',editedQuery);
            console.log('Editing cleared the original and translated cache variants and republished the new source version.');
            sql("UPDATE topics SET status='hidden' WHERE id='"+topic+"'");
            assert.equal((await read(false,'fr',projected.token)).reason,'not_found');
            await wakeProjection();
            const withdrawn=result=>result.payload?.data===null;
            await waitForCdn(withdrawn,'Canonical CDN withdrawal',wakeProjection);
            await waitForCdn(withdrawn,'Query CDN withdrawal',wakeProjection,query);
            await waitForCdn(withdrawn,'Translated query CDN withdrawal',wakeProjection,editedQuery);
            console.log('Standard and query CDN URLs no longer expose the withdrawn original or translation.');
            passed=true;
          } finally {
            try {
              if(fixtureStarted)sql("DELETE FROM topics WHERE id='"+topic+"'; DELETE FROM user_sessions WHERE id='"+actor+"'; DELETE FROM users WHERE id='"+actor+"'");
            } catch(error) {
              passed=false;
              throw error;
            } finally {
              if(!passed&&setting==='false')sql("UPDATE settings SET value='false' WHERE key='translation_enabled'");
            }
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Preview only: real Azure NMT, cold read, same-language skip, D1 cache and provenance, R2/CDN HIT, two-hour cache policy, signed-in viewer state, edit and withdrawal of standard and query URLs and fixture cleanup passed. Translation remains enabled.\n');
          JS
