name: Spine DEV Google direct SSO online smoke
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths:
      - src/auth.ts
      - .github/workflows/spine-dev-google-direct-smoke.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm developer login skips Identity Center provider choice
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          const origin='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev';
          const issuer='https://dev-identity-center.119shenhao.workers.dev';
          let ok=false;
          for(let attempt=1;attempt<=20;attempt++){
            try{
              const local=await fetch(origin+'/api/auth/identity?return_to=%2F',{redirect:'manual',signal:AbortSignal.timeout(14000)});
              if(local.status!==302)throw Error('forum redirect not ready');
              const center=new URL(local.headers.get('location'));
              if(center.origin!==issuer||center.pathname!=='/oauth/authorize'||
                center.searchParams.get('provider_hint')!=='google'||
                center.searchParams.get('client_id')!=='spine-community-dev'||
                center.searchParams.get('redirect_uri')!=='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev/api/auth/identity/callback'||
                center.searchParams.get('code_challenge_method')!=='S256')
                throw Error('forum Google hint or OAuth parameter not ready');
              const next=await fetch(center,{redirect:'manual',signal:AbortSignal.timeout(14000)});
              if(next.status!==302)throw Error('center not redirecting directly');
              const google=new URL(next.headers.get('location'));
              if(google.origin!=='https://accounts.google.com'||google.pathname!=='/o/oauth2/v2/auth'||
                 google.searchParams.get('redirect_uri')!==issuer+'/oauth/providers/google/callback'||
                 !(next.headers.get('set-cookie')||'').includes('__Host-ic_oauth_'))
                 throw Error('unexpected upstream Google or proof Cookie');
              ok=true;
              console.log('PASS: Spine DEV forum -> Identity Center (no HTML chooser) -> Google.');
              break;
            }catch(e){
              console.log('Attempt '+attempt+' waiting for both DEV Worker builds to be deployed.');
            }
            if(attempt<20)await new Promise(r=>setTimeout(r,12000));
          }
          if(!ok)throw Error('Spine DEV direct Google handoff was not verified.');
          const noState=await fetch(origin+'/api/auth/identity/callback',{redirect:'manual',signal:AbortSignal.timeout(14000)});
          if(noState.status!==401)throw Error('Missing OAuth browser proof must be rejected.');
          const legacy=await fetch(origin+'/api/auth/google',{redirect:'manual',signal:AbortSignal.timeout(14000)});
          if(legacy.status!==410)throw Error('Legacy direct Google endpoint must remain disabled.');
          console.log('PASS: invalid callback rejected and original direct Google endpoint remains disabled.');
          NODE
