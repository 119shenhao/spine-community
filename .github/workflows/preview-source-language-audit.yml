name: Preview source-language audit and live SEO (read-only)
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/preview-source-language-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == '119shenhao/spine-community' && github.ref == 'refs/heads/feature/v1-community-build-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '289976272520a38732bef34108585e11'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read-only aggregate audit of PREVIEW D1
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run audit:languages -- --target=preview
      - name: Check deployed preview HTML and language metadata (GET requests only)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev';
          const get=async(path)=>fetch(base+path,{redirect:'error',signal:AbortSignal.timeout(15000),headers:{'cache-control':'no-cache'}});
          const robots=await get('/robots.txt');
          assert.equal(robots.status,200);
          assert.match(await robots.text(),/Disallow: \/$/m);
          const home=await get('/');
          assert.equal(home.status,200);
          assert.match(home.headers.get('x-robots-tag')||'',/noindex/);
          const sitemap=await get('/sitemap.xml');
          assert.equal(sitemap.status,404);
          const feed=await get('/api/topics?sort=latest');
          assert.equal(feed.status,200);
          const data=await feed.json();
          const topics=(data.topics||[]).filter(x=>x.status==='published');
          assert(topics.length>0,'Preview has no published public post available for live validation');
          const counts={};
          let examined=0;
          for(const topic of topics.slice(0,25)){
            if(typeof topic.id!=='string')continue;
            const id=encodeURIComponent(topic.id);
            const page=await get('/topic/'+id);
            assert.equal(page.status,200);
            assert.match(page.headers.get('x-robots-tag')||'',/noindex/);
            const html=await page.text();
            const canon='<link rel="canonical" href="https://spine.nbn369.com/topic/'+id+'">';
            assert(html.includes(canon),'Incorrect canonical on post '+topic.id);
            assert.match(html,/<article class="panel"><h1>/);
            assert.match(html,/<div class="prose">/);
            assert.match(html,/<meta name="description" content="[^"]*">/);
            const rawLang=topic.source_lang;
            const expected=typeof rawLang==='string'&&/^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})?$/.test(rawLang)?rawLang:'und';
            assert(html.includes('<html lang="'+expected+'">'),'SSR language disagrees with D1-backed feed for '+topic.id);
            const different=await get('/topic/'+id+'?lang=fr');
            assert.equal(different.status,200);
            const alt=await different.text();
            assert(alt.includes(canon));
            assert(alt.includes('<html lang="'+expected+'">'),'Reader language polluted SSR SEO');
            const pageTitle=html.match(/<title>([^<]*)<\/title>/)?.[1];
            assert(pageTitle&&alt.includes('<title>'+pageTitle+'</title>'),'Reader language polluted page title');
            counts[expected]=(counts[expected]||0)+1;
            examined++;
          }
          assert(examined>0);
          console.log('Preview live public SSR/noindex/canonical/SEO/reader-query check passed. Examined:',examined);
          console.log('Sample source-language counts (public feed only):',JSON.stringify(counts));
          console.log('No source text, patient IDs or secrets emitted; no database or API writes.');
          JS
