name: Verify preview database content cleared
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/verify-preview-clear-once.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all visible posts gone and Unknown User retained
        shell: bash
        run: |
          set -euo pipefail
          base='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          curl -fsS --retry 2 --max-time 30 "$base/api/health" > health.json
          curl -fsS --retry 2 --max-time 30 "$base/api/topics" > topics.json
          curl -fsS --retry 2 --max-time 30 "$base/api/import/account" > account.json
          python3 - <<'PY'
          import json
          h=json.load(open('health.json'))
          t=json.load(open('topics.json'))
          a=json.load(open('account.json'))
          assert h['databaseReady'] is True and h['importEnabled'] is True, h
          assert len(t['topics'])==0, t['topics']
          assert a['account']['id']=='system-unknown-import', a
          print("Verified: ZERO visible discussions, Unknown User system account retained.")
          print("Preview DB ready:",h['databaseReady'],"Import enabled:",h['importEnabled'])
          PY
