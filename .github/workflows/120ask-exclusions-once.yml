name: 120ask exclusions check
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/120ask-exclusions-once.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source page structure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/120ask-venv"
          "$RUNNER_TEMP/120ask-venv/bin/pip" install -q beautifulsoup4
          "$RUNNER_TEMP/120ask-venv/bin/python" - <<'PY'
          import collections
          import json
          import re
          import subprocess
          import time
          from urllib.parse import urlencode, urljoin, urlsplit
          from bs4 import BeautifulSoup, Tag
          
          base = 'https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          site = '120ask'
          collector = 'chatgpt-hourly-120ask'
          
          def request(url, payload=None):
              cmd = ['curl', '-sS', '--connect-timeout', '8', '--max-time', '20', '--compressed', '-w', '\n%{http_code}']
              if payload is not None:
                  cmd += ['-H', 'Content-Type: application/json', '--data-binary', '@-']
              result = subprocess.run(cmd + [url], input=json.dumps(payload, ensure_ascii=False).encode() if payload is not None else None, stdout=subprocess.PIPE, check=True)
              body, status = result.stdout.rsplit(b'\n', 1)
              return int(status), body
          
          def api(path, payload=None):
              status, body = request(base + path, payload)
              try:
                  data = json.loads(body)
              except ValueError:
                  raise RuntimeError('Preview endpoint returned HTTP ' + str(status) + ' without JSON') from None
              if status not in (200, 201):
                  raise RuntimeError('Preview endpoint returned HTTP ' + str(status) + ' ' + str(data.get('error')))
              return data
          
          def exclusions():
              params = {'site': site, 'limit': 200}
              seen = set()
              result = {}
              while True:
                  data = api('/api/collect/exclusions?' + urlencode(params))
                  if data.get('site') != site:
                      raise ValueError('Wrong site in exclusions response')
                  result.update((item['source_id'], item['status']) for item in data['items'])
                  cursor = data['next_cursor']
                  if cursor is None:
                      return result
                  if cursor in seen:
                      raise ValueError('Repeated exclusion cursor')
                  seen.add(cursor)
                  params['cursor'] = cursor
          
          def candidate_links():
              found = {}
              dirs = [
                  'https://www.120ask.com/list/jsjzwk/',
                  'https://www.120ask.com/list/jingzhuibing/',
                  'https://www.120ask.com/list/yaozhuibing/',
                  'https://m.120ask.com/list/jsjzwk/',
                  'https://m.120ask.com/list/yaozhuibing/',
                  'https://m.120ask.com/list/jingzhuibing/',
              ]
              for url in dirs:
                  code, body = request(url)
                  print('Listing', url, code, len(body), flush=True)
                  time.sleep(1)
                  if code != 200:
                      continue
                  soup = BeautifulSoup(body, 'html.parser')
                  for link in soup.find_all('a', href=True):
                      href = urljoin(url, link['href'])
                      parts = urlsplit(href)
                      title = link.get_text(' ', strip=True)
                      if not re.search(r'颈椎|腰椎|腰突|腰痛|腰疼|腰部|椎间盘|椎管|手指.{0,8}麻', title):
                          continue
                      if parts.hostname not in ('m.120ask.com', 'www.120ask.com', 'tag.120ask.com'):
                          continue
                      match = re.fullmatch(r'/(?:question|askg/(?:bd_detail|posts_detail))/([0-9a-z]{8,25})(?:\.html?)?/?', parts.path)
                      if not match:
                          continue
                      stable_id = match[1]
                      score = 2 * bool(re.search(r'手术|术后|消融|康复|恢复|治疗', title)) + bool(re.search(r'腿|手|麻|疼', title))
                      if stable_id not in found or parts.hostname == 'www.120ask.com':
                          found[stable_id] = (href, score)
              return found
          
          before = exclusions()
          found = candidate_links()
          eligible = sorted((k for k in found if k not in before), key=lambda k: found[k][1], reverse=True)
          print('Candidates', len(found), 'excluded', len(found)-len(eligible), flush=True)
          for rec in api('/api/collect/claim', {'site': site, 'collector_id': collector, 'source_ids': eligible[:8]})['results']:
              key = rec['source_id']
              if rec['result'] != 'granted':
                  print('Claim status', key, rec['result'], flush=True)
                  continue
              lease = {'site': site, 'source_id': key, 'lease_token': rec['lease_token']}
              try:
                  source = found[key][0]
                  if source.startswith('https://m.120ask.com/') and key.isdigit():
                      source = 'https://www.120ask.com/question/' + key + '.htm'
                  code, body = request(source)
                  time.sleep(1)
                  print('Source', key, code, flush=True)
                  if code != 200:
                      continue
                  soup = BeautifulSoup(body, 'html.parser')
                  ask = soup.select_one('#d_msCon')
                  if not ask:
                      print('Missing question markup', key)
                      continue
                  def shape(tag):
                      if isinstance(tag, Tag):
                          return [tag.name, tag.get('class', []), bool(tag.get('id')), len(tag.get_text(strip=True))]
                      return ['text', len(str(tag).strip())]
                  print('Question structure', key, [shape(n) for n in ask.children if isinstance(n, Tag) or str(n).strip()], 'links/images', [(n.name, n.get('class', [])) for n in ask.select('a,img,video')], flush=True)
                  for container in soup.select('.b_answerbox'):
                      header = container.select_one('.b_answerti')
                      print('Answer header', key, re.findall(r'\d+', header.get_text(strip=True)) if header else [], flush=True)
                      for answer in container.select('.b_answerli:not(.zhenshiAD)'):
                          print('Answer structure', key, [
                              (shape(n), ' '.join(n.parent.get('class', [])), [shape(x) for x in n.children if isinstance(x, Tag) or str(x).strip()]) for n in answer.select('.b_anscont_cont > *, .b_anscontc > *, [class*=more], [class*=follow], [class*=zhui]') if isinstance(n, Tag)
                          ], flush=True)
              except (RuntimeError, subprocess.SubprocessError) as error:
                  print('Source inspection failed', key, type(error).__name__, flush=True)
              finally:
                  print('Released', key, api('/api/collect/release', lease)['status'], flush=True)
          PY
