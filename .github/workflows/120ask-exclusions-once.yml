name: 120ask exclusions check
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/120ask-exclusions-once.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Collect and verify authorized 120ask posts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/120ask-venv"
          "$RUNNER_TEMP/120ask-venv/bin/pip" install -q beautifulsoup4
          "$RUNNER_TEMP/120ask-venv/bin/python" - <<'PY'
          import collections
          import json
          import re
          import subprocess
          import time
          from urllib.parse import urlencode, urljoin, urlsplit
          from bs4 import BeautifulSoup, Tag
          
          base = 'https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          site = '120ask'
          collector = 'chatgpt-hourly-120ask'
          
          def request(url, payload=None):
              cmd = ['curl', '-sS', '--connect-timeout', '8', '--max-time', '20', '--compressed', '-w', '\n%{http_code}']
              if payload is not None:
                  cmd += ['-H', 'Content-Type: application/json', '--data-binary', '@-']
              result = subprocess.run(cmd + [url], input=json.dumps(payload, ensure_ascii=False).encode() if payload is not None else None, stdout=subprocess.PIPE, check=True)
              body, status = result.stdout.rsplit(b'\n', 1)
              return int(status), body
          
          def api(path, payload=None):
              status, body = request(base + path, payload)
              try:
                  data = json.loads(body)
              except ValueError:
                  raise RuntimeError('Preview endpoint returned HTTP ' + str(status) + ' without JSON') from None
              if status not in (200, 201):
                  raise RuntimeError('Preview endpoint returned HTTP ' + str(status) + ' ' + str(data.get('error')))
              return data
          
          def exclusions():
              params = {'site': site, 'limit': 200}
              seen = set()
              result = {}
              while True:
                  data = api('/api/collect/exclusions?' + urlencode(params))
                  if data.get('site') != site:
                      raise ValueError('Wrong site in exclusions response')
                  result.update((item['source_id'], item['status']) for item in data['items'])
                  cursor = data['next_cursor']
                  if cursor is None:
                      return result
                  if cursor in seen:
                      raise ValueError('Repeated exclusion cursor')
                  seen.add(cursor)
                  params['cursor'] = cursor
          
          from bs4 import Comment, NavigableString
          
          candidate_ids = [
              '108776065','108745267','108745222','108754700','108751507','108745257','108744527','108744482','108734175',
              '108784555','108773871','108771630','108769517','108767734','108760108',
              '108649013','108520169','108459519','108459462','108459440',
          ]
          
          def original_text(tag):
              chunks = []
              def walk(node):
                  if isinstance(node, Comment):
                      return
                  if isinstance(node, NavigableString):
                      chunks.append(re.sub(r'[\t\r\n ]+', ' ', str(node)))
                  elif node.name == 'br':
                      chunks.append('\n')
                  elif node.name not in ('script', 'style', 'noscript'):
                      block = node.name in ('p', 'div', 'li')
                      if block and chunks:
                          chunks.append('\n')
                      for child in node.children:
                          walk(child)
                      if block:
                          chunks.append('\n')
              walk(tag)
              return '\n'.join(line.strip() for line in ''.join(chunks).strip().splitlines()).strip()
          
          def source_topic(key, body):
              soup = BeautifulSoup(body, 'html.parser')
              title, ask = soup.select_one('#d_askH1'), soup.select_one('#d_msCon')
              boxes = soup.select('.b_answerbox')
              if not title or not ask or len(boxes) != 1:
                  raise ValueError('question_or_answer_markup_missing')
              if ask.select_one('img,video,a[href*="120askimages"]'):
                  raise ValueError('question_has_media')
              title_text, body_text = original_text(title), original_text(ask)
              if not re.search(r'颈椎|腰椎|腰突|腰痛|腰疼|腰部|椎间盘|椎管|腰[1-5]|[Ll][1-5].{0,5}[SsLl][1-5]', title_text + body_text):
                  raise ValueError('topic_relevance_uncertain')
              box = boxes[0]
              if box.find(string=re.compile(r'提问人的追问|医生的回复|患者追问|继续阅读|展开全部回答|查看全部回答|加载更多回答')):
                  raise ValueError('unverified_followup_or_hidden_replies')
              answer_nodes = box.select('.b_answerli:not(.zhenshiAD)')
              if not answer_nodes or box.select('.b_anscont_cont .crazy_new') == []:
                  raise ValueError('no_public_answers')
              header = box.select_one('.b_answerti')
              if not header:
                  raise ValueError('answer_header_missing')
              header_text = header.get_text(strip=True)
              expected = re.search(r'\d+', header_text)
              if expected and int(expected.group()) != len(answer_nodes):
                  raise ValueError('answer_count_mismatch')
              print('Source structure', key, header_text, len(answer_nodes), flush=True)
              comments = []
              for answer in answer_nodes:
                  content = answer.select('.b_anscont_cont')
                  if len(content) != 1:
                      raise ValueError('answer_container_ambiguous')
                  replies = content[0].select('.crazy_new')
                  if len(replies) != 1 or replies[0].select_one('img,video'):
                      raise ValueError('answer_content_ambiguous')
                  answer_text = original_text(replies[0])
                  if re.sub(r'\s+', '', original_text(content[0])) != re.sub(r'\s+', '', answer_text):
                      raise ValueError('extra_unmapped_answer_text')
                  area = answer.select_one('.b_anscontc')
                  if not area or any(
                      node.get_text(strip=True)
                      for node in area.find_all(recursive=False)
                      if not set(node.get('class', [])) & {'b_anscont_time', 'b_anscont_cont', 'b_askbox_btn'}
                  ):
                      raise ValueError('reply_structure_unverified')
                  if not answer_text:
                      raise ValueError('empty_answer')
                  comments.append({'body': answer_text, 'source_lang': 'zh-CN'})
          
              if not title_text or not body_text or len(body_text) < 12 or len(comments) > 49:
                  raise ValueError('incomplete_question_or_reply_limit')
              public_text = '\n'.join([title_text, body_text] + [c['body'] for c in comments])
              if re.search(r'\[?图片\d*\]?|见(?:附件|附图|下图)|图片已隐藏|内容已隐藏|仅医生可见|登录后查看|点击查看全文', public_text):
                  raise ValueError('missing_or_referenced_attachment')
              if re.search(r'(?<!\d)(?:1[3-9]\d{9}|\d{17}[\dXx])(?!\d)|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}|(?:姓名|住址|联系电话|身份证号|手机号|微信号|病历号|报告编号)\s*[:：]', public_text):
                  raise ValueError('possible_personal_identifier')
              return {'title': title_text, 'body': body_text, 'source_lang': 'zh-CN', 'comments': comments}
          
          def verify(topic_id, draft):
              actual = api('/api/topics/' + topic_id)
              topic, comments = actual['topic'], actual['comments']
              if any(topic.get(field) != draft[field] for field in ('title','body','source_lang')):
                  return False
              if len(comments) != len(draft['comments']) or actual.get('next') is not None:
                  return False
              if topic.get('nickname') not in ('未知用户','Unknown User'):
                  return False
              return all(row.get('parent_comment_id') is None and row.get('nickname') in ('未知用户','Unknown User')
                         and row.get('body') == original['body'] and row.get('source_lang') == original['source_lang']
                         for row, original in zip(comments, draft['comments']))
          
          before = exclusions()
          eligible = [key for key in candidate_ids if key not in before]
          print('Initial exclusions', dict(collections.Counter(before.values())), flush=True)
          print('Run candidates', len(candidate_ids), 'excluded', len(candidate_ids)-len(eligible), flush=True)
          new_topics = new_comments = granted = 0
          completed = set()
          drafts = []
          bad_source = 0
          records = []
          try:
              if eligible:
                  records = api('/api/collect/claim', {'site': site, 'collector_id': collector, 'source_ids': eligible[:14]})['results']
              granted = sum(record['result'] == 'granted' for record in records)
              print('Claims', dict(collections.Counter(record['result'] for record in records)), flush=True)
              for record in records:
                  key = record['source_id']
                  if record['result'] != 'granted':
                      print('Skipped claim', key, record['result'], flush=True)
                      continue
                  if bad_source >= 2:
                      print('Skipped source', key, 'consecutive_source_5xx_or_access_errors', flush=True)
                      continue
                  url = 'https://www.120ask.com/question/' + key + '.htm'
                  try:
                      status, body = request(url)
                      time.sleep(1)
                      if status != 200:
                          print('Skipped source', key, 'HTTP', status, flush=True)
                          bad_source = bad_source + 1 if status in (403, 429) or status >= 500 else 0
                          if bad_source == 1:
                              time.sleep(8)
                          continue
                      bad_source = 0
                      draft = source_topic(key, body)
                      drafts.append((key, url, draft, record['lease_token']))
                  except (ValueError, subprocess.SubprocessError) as error:
                      print('Skipped source', key, str(error) if isinstance(error, ValueError) else type(error).__name__, flush=True)
              for key, url, draft, token in sorted(drafts, key=lambda row: -len(row[2]['comments'])):
                  if new_topics >= 7:
                      break
                  try:
                      result = api('/api/collect/complete', {'site': site, 'source_id': key, 'lease_token': token, 'topic': draft})
                  except (RuntimeError, subprocess.SubprocessError) as error:
                      print('Complete failed', key, str(error) if isinstance(error, RuntimeError) else type(error).__name__, flush=True)
                      continue
                  completed.add(key)
                  topic_id = result['topic_id']
                  count = result['imported']
                  new_topics += count['topics']
                  new_comments += count['comments']
                  if not count['topics']:
                      print('Duplicate', key, url, topic_id, flush=True)
                      continue
                  try:
                      checked = verify(topic_id, draft)
                  except (RuntimeError, ValueError, subprocess.SubprocessError):
                      checked = False
                  print('Imported', json.dumps({'source_id':key,'url':url,'topic_id':topic_id,'comments':count['comments'],'readback':checked}), flush=True)
          finally:
              for record in records:
                  key = record['source_id']
                  if record['result'] != 'granted' or key in completed:
                      continue
                  try:
                      api('/api/collect/release', {'site': site, 'source_id': key, 'lease_token': record['lease_token']})
                      print('Released', key, flush=True)
                  except (RuntimeError, subprocess.SubprocessError) as error:
                      print('Release could not be confirmed', key, str(error) if isinstance(error, RuntimeError) else type(error).__name__, flush=True)
              print('Totals', json.dumps({'granted':granted, 'complete':len(completed), 'new_topics':new_topics, 'new_comments':new_comments}), flush=True)
              if completed:
                  after = exclusions()
                  print('Verified exclusions', json.dumps({key: after.get(key) for key in sorted(completed)}), flush=True)
          PY
