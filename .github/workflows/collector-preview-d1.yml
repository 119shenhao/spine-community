name: Preview collector D1 queue migration
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [migrations/preview-only/**, wrangler.collector-preview.json, .github/workflows/collector-preview-d1.yml]
permissions:
  contents: read
concurrency:
  group: spine-preview-collector-db
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: '289976272520a38732bef34108585e11'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify preview-only target and credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_PREVIEW_D1_API_TOKEN secret is missing"; exit 1; }
          node -e 'const c=require("./wrangler.collector-preview.json");if(c.d1_databases[0].database_id!=="4362537a-5748-4a05-b0c4-219c3db36996")process.exit(1)'
      - name: Apply collector-only migration to preview D1
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.collector-preview.json
      - name: Confirm queue tables exist
        run: npx wrangler d1 execute PREVIEW_DB --remote --config wrangler.collector-preview.json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('collector_candidates','collector_source_state')"
