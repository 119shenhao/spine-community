name: Preview public source accessibility probe
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/collector-public-source-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python3 -m pip -q install 'beautifulsoup4==4.13.4'
      - name: Verify public pages and sanitized markup features
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from urllib.parse import urlparse
          from collections import Counter
          from bs4 import BeautifulSoup
          import time,re,json
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          op=build_opener(NoRedirect())
          pages={
           'healthunlocked_thread':'https://healthunlocked.com/painconcern/posts/153318229/spinal-decompression-surgery-on-saturday',
           'mayo_short_thread':'https://connect.mayoclinic.org/discussion/old-scoliosis-surgery/',
          }
          for label,url in pages.items():
              try:
                  with op.open(Request(url,headers={'User-Agent':'SpineCommunityCollector/1.0','Accept':'text/html'}),timeout=15) as r:
                      html=r.read(1500000)
                      code=r.status
              except HTTPError as e:
                  print(json.dumps({'page':label,'status':e.code,'reason':'access_rejected_or_redirect'}),flush=True);time.sleep(3);continue
              except (URLError,OSError):
                  print(json.dumps({'page':label,'status':None,'reason':'network_failure'}),flush=True);time.sleep(3);continue
              soup=BeautifulSoup(html,'html.parser')
              links=[]
              for node in soup.select('a[href]'):
                  path=urlparse(node['href']).path
                  if (label.startswith('mayo') and '/discussion/' in path) or (label.startswith('healthunlocked') and ('/posts/' in path or 'pain' in path or 'spine' in path)):
                      links.append(path)
              classes=Counter((node.name,c) for node in soup.select('[class]') for c in node.get('class',[]) if re.search('comment|response|discussion|content|post|reply|body|pagination|forum|thread|message|topic|activity',c,re.I))

              h1=soup.select_one('h1')
              ancestry=[]
              for i in range(5):
                  if h1 is None: break
                  ancestry.append({'tag':h1.name,'classes':h1.get('class',[])})
                  h1=h1.parent
              results={}
              for selector in ['.single-discussion-body','.single-comment-body','.comment-container','.discussion-content','.comment-individual-row','#js-post-heading','.js-post-body','[class*="postBody"]','[class*="reply"]','[class*="Reply"]','[class*="Response"]','[class*="post__"]','[class*="postDetail"]','[class*="postHeading"]']:
                  nodes=soup.select(selector)
                  if nodes:
                      node=nodes[0]
                      results[selector]={'count':len(nodes),'children':[{'tag':x.name,'classes':x.get('class',[])} for x in node.find_all(recursive=False)][:14]}
              print(json.dumps({'page':label,'status':code,'bytes':len(html),'candidate_paths':list(dict.fromkeys(links))[:8],'classes':classes.most_common(90),'article_count':len(soup.select('article')),'h1_ancestry':ancestry,'structure':results}),flush=True)
              time.sleep(3)
          PY
