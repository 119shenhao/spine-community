name: Preview language upgrade health (read-only)
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/preview-language-health.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed Preview Worker and language schema (no writes)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {setTimeout as delay} from 'node:timers/promises';
          const url='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev/api/health';
          const version='0.5.0-language-detection-upgrade.1';
          let last=null;
          for(let attempt=0;attempt<20;attempt++){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(10000),redirect:'error'});
              const value=await response.json();
              last={status:response.status,version:value.version,environment:value.environment,
                databaseReady:value.databaseReady,languageDetection:value.languageDetection};
              console.log('Preview health',JSON.stringify(last));
              if(response.ok&&value.version===version&&value.environment==='preview'&&
                 value.languageDetection?.engine==='tinyld-heavy'&&
                 value.languageDetection?.schemaReady===true&&value.databaseReady===true){
                console.log('Preview language upgrade is deployed and D1 migration is available.');
                process.exit(0);
              }
            }catch(e){last={error:String(e?.message||e)};console.log('Preview probe',JSON.stringify(last));}
            await delay(8000);
          }
          console.error('Preview deployment not confirmed:',JSON.stringify(last));
          process.exit(1);
          JS
