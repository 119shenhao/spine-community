name: Preview language upgrade health (read-only)
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/preview-language-health.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed Preview Worker and language schema (no writes)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {setTimeout as delay} from 'node:timers/promises';
          const url='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev/api/health';
          const version='0.5.0-language-detection-upgrade.1';
          let last=null;
          for(let attempt=0;attempt<20;attempt++){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(10000),redirect:'error'});
              const value=await response.json();
              last={status:response.status,version:value.version,environment:value.environment,
                databaseReady:value.databaseReady,languageDetection:value.languageDetection};
              console.log('Preview health',JSON.stringify(last));
              if(response.ok&&value.version===version&&value.environment==='preview'&&
                 value.languageDetection?.engine==='tinyld-heavy'&&
                 value.languageDetection?.schemaReady===true&&value.databaseReady===true){
                console.log('Preview language upgrade is deployed and D1 migration is available.');
                process.exit(0);
              }
            }catch(e){last={error:String(e?.message||e)};console.log('Preview probe',JSON.stringify(last));}
            await delay(8000);
          }
          console.error('Preview deployment not confirmed:',JSON.stringify(last));
          process.exit(1);
          JS
      - name: Verify currently deployed revisioned frontend and admin menu (read-only)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdirSync,readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {setTimeout as delay} from 'node:timers/promises';

          const base='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev';
          const files=readdirSync('public').filter(name=>/\\.(?:js|css)$/.test(name)).sort();
          const hash=createHash('sha256');
          for(const name of files){
            hash.update(name);hash.update('\\0');hash.update(readFileSync('public/'+name));
          }
          const expected=hash.digest('hex').slice(0,16);
          let revision=null,html='';
          for(let i=0;i<24;i++){
            const url=base+'/?utm_source=chatgpt.com&revision_probe='+expected+'-'+i;
            const response=await fetch(url,{redirect:'error',signal:AbortSignal.timeout(10000),headers:{'cache-control':'no-cache'}});
            assert.equal(response.status,200,'Homepage is unavailable');
            const cache=response.headers.get('cache-control')||'';
            assert(cache.includes('no-store'),'Homepage HTML is still cacheable: '+cache);
            html=await response.text();
            revision=html.match(/src="\\/_app\\/([a-f0-9]{16})\\/app\\.js"/)?.[1]||null;
            if(revision===expected)break;
            console.log('Waiting for frontend deploy, expected',expected,'observed',revision);
            await delay(6000);
          }
          assert.equal(revision,expected,'Cloudflare is serving stale or unversioned frontend HTML');
          assert(html.includes('/_app/'+expected+'/styles.css'),'CSS must share the new revision');
          for(const file of files){
            const response=await fetch(base+'/_app/'+expected+'/'+file,{
              redirect:'error',signal:AbortSignal.timeout(10000)
            });
            assert.equal(response.status,200,'Missing versioned asset '+file);
            const code=await response.text();
            assert.equal(code,readFileSync('public/'+file,'utf8'),'Stale asset content for '+file);
          }
          const entry=readFileSync('public/app.js','utf8');
          assert(entry.includes('translationProviders')&&entry.includes('languageReview'),
            'The current build omits admin translation navigation');
          console.log('Frontend revision confirmed',expected,'all',files.length,'assets and owner-only tabs');
          JS
