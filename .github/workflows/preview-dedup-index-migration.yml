name: Preview D1 exact-dedup and moderation indexes
# Guarded rerun after index-plan regression tests passed on the feature branch.

on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/preview-dedup-index-migration.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spine-community-preview-d1-migrations
  cancel-in-progress: false

jobs:
  validate-and-apply:
    if: github.repository == '119shenhao/spine-community' && github.ref == 'refs/heads/feature/v1-community-build-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: '289976272520a38732bef34108585e11'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify implementation and regression tests
        run: npm run verify

      - name: Inspect isolated preview migration state (read-only)
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const file='wrangler.preview-migrations.jsonc',config=JSON.parse(fs.readFileSync(file,'utf8'));
          if(config.d1_databases?.length!==1 ||
            config.d1_databases[0].binding!=='PREVIEW_DB' ||
            config.d1_databases[0].database_id!=='4362537a-5748-4a05-b0c4-219c3db36996' ||
            config.d1_databases[0].migrations_dir!=='migrations/v1')throw Error('Wrong D1 target');
          if(!process.env.CLOUDFLARE_API_TOKEN)throw Error('Preview-only token missing');
          const p=spawnSync(process.execPath,['node_modules/wrangler/bin/wrangler.js','d1','execute',
            'PREVIEW_DB','--remote','--config',file,
            '--command','SELECT name FROM d1_migrations ORDER BY id','--json'],{encoding:'utf8'});
          if(p.status!==0)throw Error('Could not inspect preview D1 migration history');
          const applied=new Set(JSON.parse(p.stdout)[0].results.map(r=>r.name));
          const files=fs.readdirSync('migrations/v1').filter(n=>n.endsWith('.sql'));
          const pending=files.filter(n=>!applied.has(n));
          const target='0019_dedup_moderation_indexes.sql';
          if(pending.some(name=>name!==target))throw Error('Unrelated migrations pending; refusing to apply');
          const approved=fs.readFileSync('migrations/v1/'+target,'utf8');
          if(!approved.startsWith('-- The content fingerprint alone cannot find historical rows'))throw Error('Unreviewed migration');
          console.log('Pending reviewed migration:',JSON.stringify(pending));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'apply='+(pending.length===1?'true':'false')+'\n');
          JS

      - name: Record preview Time Travel bookmark before migration
        if: steps.preflight.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info PREVIEW_DB --config wrangler.preview-migrations.jsonc --json > "$RUNNER_TEMP/restore.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const doc=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/restore.json','utf8'));
          if(typeof doc.bookmark!=='string'||!doc.bookmark)throw Error('No restore bookmark, refusing migration');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Preview D1 Time Travel restore bookmark: `'+doc.bookmark+'`\n');
          JS

      - name: Apply migration 0019 to isolated preview D1 only
        if: steps.preflight.outputs.apply == 'true'
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Verify indexes and indexed execution plans (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import fs from 'node:fs';
          const run=sql=>{
            const p=spawnSync(process.execPath,['node_modules/wrangler/bin/wrangler.js','d1','execute',
              'PREVIEW_DB','--remote','--config','wrangler.preview-migrations.jsonc',
              '--command',sql,'--json'],{encoding:'utf8'});
            if(p.status!==0)throw Error('Read-only preview SQL failed: '+(p.stderr||p.stdout).slice(-280));
            const res=JSON.parse(p.stdout);
            if(res.length!==1||!res[0].success)throw Error('D1 preview verification query rejected');
            return res[0].results;
          };
          const expected=[
            'idx_topics_exact_title','idx_topics_moderation_recent','idx_comments_moderation_recent'
          ];
          const found=run("SELECT name FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%moderation_recent' OR name='idx_topics_exact_title'").map(x=>x.name);
          if(expected.some(name=>!found.includes(name)))throw Error('Missing expected dedup or moderation index');
          if(run("SELECT name FROM d1_migrations WHERE name='0019_dedup_moderation_indexes.sql'").length!==1)
            throw Error('Migration 0019 not recorded');
          const dup=run("EXPLAIN QUERY PLAN SELECT id,status FROM topics WHERE content_hash='example-hash' OR (title='example-title' AND body='example-body') LIMIT 2")
            .map(x=>x.detail).join(' | ');
          if(!dup.includes('idx_topics_exact_title')||!dup.includes('ux_topics_content_hash'))
            throw Error('Duplicate lookup not using title and fingerprint indexes: '+dup);
          const moderation=run("EXPLAIN QUERY PLAN SELECT id,'topic' type,author_id,title,body,status,created_at FROM topics WHERE status IN ('pending_review','blocked','hidden') UNION ALL SELECT id,'comment',author_id,NULL,body,status,created_at FROM comments WHERE status IN ('pending_review','blocked','hidden') ORDER BY created_at DESC LIMIT 100")
            .map(x=>x.detail).join(' | ');
          if(!moderation.includes('idx_topics_moderation_recent')||
             !moderation.includes('idx_comments_moderation_recent'))
            throw Error('Moderation queue not using both partial indexes: '+moderation);
          const summary='Migration 0019 present; all three indexes found; dedup + moderation indexed query plans verified.';
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n');
          JS
