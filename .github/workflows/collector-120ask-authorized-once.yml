name: Authorized 120ask one-time preview import
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/collector-120ask-authorized-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet --break-system-packages beautifulsoup4
      - name: Follow exclusions claim complete verify against preview only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, re, sys
          from bs4 import BeautifulSoup
          BASE='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          SITE='120ask'
          SOURCE_ID='22185258'
          SOURCE_URL='https://m.120ask.com/askg/posts_detail/'+SOURCE_ID
          def call(path, data=None):
              b=None if data is None else json.dumps(data,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(BASE+path,data=b,headers={'Accept':'application/json','User-Agent':'SpineCommunity-AuthorizedCollector/1.0',**({'Content-Type':'application/json'} if b is not None else {})},method='POST' if b is not None else 'GET')
              with urllib.request.urlopen(req,timeout=35) as response:
                  return response.status,json.load(response)
          print('ENVIRONMENT preview_only=true source_site=120ask')
          cursor=None
          excluded=set()
          pages=0
          while True:
              params={'site':SITE,'limit':'500'}
              if cursor: params['cursor']=cursor
              status,data=call('/api/collect/exclusions?'+urllib.parse.urlencode(params))
              assert status==200 and data['site']==SITE
              excluded.update(item['source_id'] for item in data['items'])
              pages+=1
              cursor=data['next_cursor']
              if cursor is None: break
              if pages>=100: raise RuntimeError('exclusions_over_100_pages')
          print(f'EXCLUSIONS pages={pages} count={len(excluded)} candidate_excluded={SOURCE_ID in excluded}')
          if SOURCE_ID in excluded:
              print('RESULT skipped_already_collected_or_claimed; no writes')
              sys.exit(0)
          _,claimed=call('/api/collect/claim',{'site':SITE,'collector_id':'chatgpt-once-120ask','source_ids':[SOURCE_ID]})
          entry=claimed['results'][0]
          print('CLAIM result='+entry['result']+' lease_seconds='+str(claimed['lease_seconds']))
          if entry['result']!='granted':
              print('RESULT skipped_other_collector; no content written')
              sys.exit(0)
          token=entry['lease_token']
          completed=False
          try:
              req=urllib.request.Request(SOURCE_URL,headers={'User-Agent':'Mozilla/5.0 (compatible; SpineCommunityAuthorizedCollector/1.0)'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  assert response.status==200
                  raw=response.read(400000).decode('utf-8','replace')
              soup=BeautifulSoup(raw,'html.parser')
              title=soup.h1.get_text(' ',strip=True) if soup.h1 else ''
              for element in soup(['script','style','noscript','svg','footer','header']): element.decompose()
              txt=soup.get_text(' ',strip=True)
              def between(a,b):
                  if a not in txt or b not in txt.split(a,1)[1]: raise RuntimeError('missing_marker_'+a)
                  return txt.split(a,1)[1].split(b,1)[0].strip()
              prefix=re.search(r'性别：\s*[^ ]+\s+年龄：\s*\d+岁',txt.split('健康咨询描述：',1)[0])
              main='健康咨询描述： '+between('健康咨询描述：','关闭 满意答案')
              if prefix: main=prefix.group(0)+' '+main
              initial='病情分析： '+between('病情分析：','投诉 追问')
              follow=between('患者追问','附件：点击查看大图')
              doctor='医生回复： '+between('医生回复：','附件：点击查看大图')
              # Some source layouts prefix the follow-up with a date; preserve text, not unrelated buttons.
              follow=re.sub(r'^\s*\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?\s*','',follow).strip()
              for part in [title,main,initial,follow,doctor]:
                  assert len(part)>12, 'incomplete_source_section'
                  assert len(part)<30000, 'source_section_too_large'
              assert '颈椎' in title and '手术' in main and '颈托' in follow
              data={'site':SITE,'source_id':SOURCE_ID,'lease_token':token,'topic':{'title':title,'body':main,'source_lang':'zh-CN','comments':[{'body':initial,'source_lang':'zh-CN','replies':[{'body':follow,'source_lang':'zh-CN','replies':[{'body':doctor,'source_lang':'zh-CN'}]}]}]}}
              print('EXTRACT title_chars='+str(len(title))+' body_chars='+str(len(main))+' comment_char_lengths='+str([len(initial),len(follow),len(doctor)])+' tree_depth=3')
              status,result=call('/api/collect/complete',data)
              completed=True
              print('COMPLETE http='+str(status)+' duplicate='+str(result.get('duplicate'))+' topic_id='+str(result.get('topic_id'))+' status='+str(result.get('topic_status'))+' imported='+str(result.get('imported')))
              assert result.get('status')=='completed'
              topic_id=result['topic_id']
              status,check=call('/api/collect/exclusions?site=120ask&limit=500')
              assert any(x['source_id']==SOURCE_ID and x['status']=='completed' for x in check.get('items',[])), 'completion_not_in_exclusions'
              print('VERIFY completion_in_exclusions=true')
              try:
                  code,detail=call('/api/topics/'+topic_id)
                  topic=detail['topic']
                  comments=detail['comments']
                  assert topic['title']==title and topic['body']==main and topic['source_lang']=='zh-CN'
                  assert len(comments)==3, 'visible_comment_count_mismatch'
                  assert [x['body'] for x in comments]==[initial,follow,doctor], 'original_text_mismatch'
                  assert comments[0]['parent_comment_id'] is None
                  assert comments[1]['parent_comment_id']==comments[0]['id']
                  assert comments[2]['parent_comment_id']==comments[1]['id']
                  assert all(x['source_lang']=='zh-CN' for x in comments)
                  print('VERIFY forum_readback=passed topic_exact=true comments_exact=true hierarchy_exact=true author='+str(topic.get('nickname')))
              except urllib.error.HTTPError as err:
                  if err.code!=404: raise
                  print('VERIFY forum_readback=not_public_404; complete accepted but moderation may hide the topic')
              print('RESULT imported_or_deduplicated=true source_id='+SOURCE_ID+' topic_id='+topic_id)
          except Exception as exc:
              print('ERROR type='+type(exc).__name__+' message='+str(exc)[:200])
              raise
          finally:
              if not completed:
                  try:
                      st,rel=call('/api/collect/release',{'site':SITE,'source_id':SOURCE_ID,'lease_token':token})
                      print('RELEASE status='+str(st)+' result='+str(rel.get('status')))
                  except Exception as err: print('RELEASE_FAILED '+type(err).__name__+' '+str(err)[:120])
          PY
