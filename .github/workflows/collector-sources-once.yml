name: One-time source diagnostics
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/collector-sources-once.yml]
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect authorized source pages after claim
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/collector-venv"
          "$RUNNER_TEMP/collector-venv/bin/pip" install -q beautifulsoup4
          "$RUNNER_TEMP/collector-venv/bin/python" - <<'PY'
          import json
          import subprocess
          import time
          from urllib.parse import urlencode, urlsplit
          from bs4 import BeautifulSoup
          
          BASE='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          SOURCES={
           'xywy': [
            ('198793816','https://club.xywy.com/wenda/198793816.htm'),
            ('198728918','https://club.xywy.com/wenda/198728918.htm'),
            ('198223887','https://club.xywy.com/wenda/198223887.htm'),
            ('198649183','https://club.xywy.com/wenda/198649183.htm'),
            ('198739706','https://club.xywy.com/wenda/198739706.htm'),
            ('198713340','https://club.xywy.com/wenda/198713340.htm')],
           'patientinfo': [
            ('563724','https://patient.info/forums/discuss/cervical-stenosis-3-level-acdf-563724'),
            ('686154','https://patient.info/forums/discuss/lumbar-spine-surgery-686154'),
            ('506340','https://patient.info/forums/discuss/lumbar-spine-fusion-506340'),
            ('584713','https://patient.info/forums/discuss/c5-c6-post-op-acdf-584713'),
            ('437895','https://patient.info/forums/discuss/almost-3-weeks-post-op-2-level-lumbar-fusion-437895'),
            ('714224','https://patient.info/forums/discuss/cervical-spinal-stenosis-714224'),
            ('489553','https://patient.info/forums/discuss/any-advice-much-appreciated-489553')],
           'mayoclinic': [
            ('how-do-i-get-thru-this-recovery-i-think-i-need-people-to-talk-to','https://connect.mayoclinic.org/discussion/how-do-i-get-thru-this-recovery-i-think-i-need-people-to-talk-to/'),
            ('cervical-spine-operation','https://connect.mayoclinic.org/discussion/cervical-spine-operation/'),
            ('told-i-would-not-walk-without-surgery','https://connect.mayoclinic.org/discussion/told-i-would-not-walk-without-surgery/'),
            ('anyone-who-has-had-cervical-spinal-compression-surgery','https://connect.mayoclinic.org/discussion/anyone-who-has-had-cervical-spinal-compression-surgery/'),
            ('lumbar-fusion-another-reprieve-or-am-i-just-delaying-the-inevitable','https://connect.mayoclinic.org/discussion/lumbar-fusion-another-reprieve-or-am-i-just-delaying-the-inevitable/'),
            ('post-surgery-from-cervical-myelopathy-timeline-of-recovery','https://connect.mayoclinic.org/discussion/post-surgery-from-cervical-myelopathy-timeline-of-recovery/'),
            ('acdf-scheduled-for-wednesday','https://connect.mayoclinic.org/discussion/acdf-scheduled-for-wednesday/')]
          }
          
          def call(url,payload=None):
           cmd=['curl','-sS','--connect-timeout','8','--max-time','25','--compressed','-w','\n%{http_code}']
           if payload is not None: cmd+=['-H','Content-Type: application/json','--data-binary','@-']
           out=subprocess.run(cmd+[url],input=json.dumps(payload).encode() if payload is not None else None,stdout=subprocess.PIPE,check=True).stdout
           body,status=out.rsplit(b'\n',1)
           try: data=json.loads(body)
           except ValueError: data=body
           return int(status),data
          def api(path,payload=None):
           code,d=call(BASE+path,payload)
           if code not in (200,201): raise RuntimeError('preview HTTP '+str(code)+' '+str(d.get('error') if isinstance(d,dict) else 'non-JSON'))
           return d
          def exclusions(site):
           query={'site':site,'limit':200}; known=set(); data={}
           while True:
            d=api('/api/collect/exclusions?'+urlencode(query))
            if d['site']!=site: raise ValueError('wrong exclusions site')
            data.update((i['source_id'],i['status']) for i in d['items'])
            cursor=d['next_cursor']
            if cursor is None:return data
            if cursor in known:raise ValueError('exclusions cursor repeated')
            known.add(cursor);query['cursor']=cursor
          for site,items in SOURCES.items():
           old=exclusions(site)
           fresh=[item for item in items if item[0] not in old]
           print('Source candidates',site,len(items),'excluded',len(items)-len(fresh),'states',json.dumps(old,ensure_ascii=False),flush=True)
           # Probe at most two at once, preserving lock cleanup.
           records=[]
           try:
            if fresh:
             records=api('/api/collect/claim',{'site':site,'collector_id':'chatgpt-on-demand-'+site,'source_ids':[item[0] for item in fresh[:min(2,len(fresh))] ]})['results']
            for record in records:
             source_id=record['source_id']
             print('Candidate claim',site,source_id,record['result'],flush=True)
             if record['result']!='granted':continue
             url=dict(items)[source_id]
             try:
              code,page=call(url)
              time.sleep(1)
              print('Original status',site,source_id,code,'bytes',len(page) if isinstance(page,bytes) else 0,flush=True)
              if code!=200 or not isinstance(page,bytes):continue
              soup=BeautifulSoup(page,'html.parser')
              print('Page headings',site,source_id,[h.get_text(' ',strip=True)[:90] for h in soup.select('h1,h2')[:4]],flush=True)
              print('Page metadata',site,source_id,[(m.get('name'),m.get('content','')[:90]) for m in soup.select('meta[name=description],meta[property="og:title"]')[:3]],flush=True)
              print('Relevant structure',site,source_id,[(el.name,' '.join(el.get('class',[]))[:100],len(el.get_text(' ',strip=True))) for el in soup.select('article,.entry-content,[class*=post],[class*=comment],[class*=reply],[class*=answer],[class*=question],[id*=comment],[id*=answer]')[:30]],flush=True)
              print('Site markers',site,source_id,'scripts',[(s.get('src') or '')[-100:] for s in soup.select('script[src]')[:8]],flush=True)
             finally:
              d=api('/api/collect/release',{'site':site,'source_id':source_id,'lease_token':record['lease_token']})
              print('Probe release',site,source_id,d['status'],flush=True)
           finally:
            pass
          PY
