name: One-time remaining-source check
on:
  push:
    branches: [feature/v1-community-build-20261106]
    paths: [.github/workflows/collector-sources-once.yml]
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check authorized XYWY and HealthUnlocked pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/source-venv"
          "$RUNNER_TEMP/source-venv/bin/pip" install -q beautifulsoup4 playwright
          "$RUNNER_TEMP/source-venv/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/source-venv/bin/python" - <<'PY'
          import json
          import subprocess
          from urllib.parse import urlencode, urlsplit
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          
          BASE='https://feature-v1-community-build-20261106-spine-community.119shenhao.workers.dev'
          def request(url,payload=None):
           cmd=['curl','-sS','-L','--connect-timeout','8','--max-time','30','--compressed','-w','\n%{http_code}']
           if payload is not None:cmd+=['-H','Content-Type: application/json','--data-binary','@-']
           out=subprocess.run(cmd+[url],input=json.dumps(payload).encode() if payload is not None else None,stdout=subprocess.PIPE,check=True).stdout
           body,status=out.rsplit(b'\n',1);return int(status),body
          def api(path,payload=None):
           code,body=request(BASE+path,payload)
           try:data=json.loads(body)
           except ValueError:raise RuntimeError('preview HTTP '+str(code)+' non-JSON') from None
           if code not in (200,201):raise RuntimeError('preview HTTP '+str(code)+' '+str(data.get('error')))
           return data
          def exclusions(site):
           params={'site':site,'limit':200}; seen=set(); result={}
           while True:
            page=api('/api/collect/exclusions?'+urlencode(params))
            result.update((x['source_id'],x['status']) for x in page['items'])
            cursor=page['next_cursor']
            if cursor is None:return result
            if cursor in seen:raise ValueError('repeated cursor')
            seen.add(cursor);params['cursor']=cursor
          
          site='xywy'
          items=[('198793816','https://club.xywy.com/wenda/198793816.htm'),('198728918','https://club.xywy.com/wenda/198728918.htm'),('198223887','https://club.xywy.com/wenda/198223887.htm'),('198649183','https://club.xywy.com/wenda/198649183.htm'),('198739706','https://club.xywy.com/wenda/198739706.htm'),('198713340','https://club.xywy.com/wenda/198713340.htm')]
          before=exclusions(site);fresh=[(sid,url) for sid,url in items if sid not in before]
          records=[]
          try:
           if fresh:records=api('/api/collect/claim',{'site':site,'collector_id':'chatgpt-hourly-xywy','source_ids':[sid for sid,url in fresh[:6]]})['results']
           print('XYWY claim results',[(r['source_id'],r['result']) for r in records],flush=True)
           with sync_playwright() as p:
            browser=p.chromium.launch()
            for rec in records:
             if rec['result']!='granted':continue
             sid=rec['source_id'];url=dict(items)[sid]
             try:
              page=browser.new_page()
              response=page.goto(url,wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(6000)
              soup=BeautifulSoup(page.content(),'html.parser')
              ask=soup.select_one('.ask_doct_reply_div')
              questions=[(e.name,' '.join(e.get('class',[])),len(e.get_text(' ',strip=True))) for e in soup.select('[class*=answer],[class*=reply],[class*=ask],[class*=question],[id*=answer],[id*=reply]')[:45]]
              print('XYWY rendered',sid,response.status if response else None,'title',bool(soup.select_one('h1')),'answer_area',bool(ask),'answer_chars',len(ask.get_text(' ',strip=True)) if ask else 0,'structures',questions,flush=True)
              page.close()
             except Exception as error:
              print('XYWY render error',sid,type(error).__name__,flush=True)
            browser.close()
          finally:
           for rec in records:
            if rec['result']!='granted':continue
            try:api('/api/collect/release',{'site':site,'source_id':rec['source_id'],'lease_token':rec['lease_token']})
            except Exception:pass
          print('XYWY probe done',flush=True)
          
          for url in ['https://healthunlocked.com/','https://healthunlocked.com/search?query=lumbar','https://healthunlocked.com/sitemap.xml','https://healthunlocked.com/robots.txt']:
           try:
            code,body=request(url);text=body.decode('utf-8','ignore')
            if '<html' in text.lower():
             soup=BeautifulSoup(text,'html.parser')
             forms=[(f.get('action'),f.get('method'),[(e.get('name'),e.get('type')) for e in f.select('input')]) for f in soup.select('form')]
             links=[a.get('href') for a in soup.select('a[href]') if any(word in (a.get('href','')+' '+a.get_text(' ',strip=True)).lower() for word in ('spine','search','community','group'))][:30]
             print('HealthUnlocked page',url,code,'title',soup.title.get_text(strip=True) if soup.title else '', 'forms',forms,'links',links,flush=True)
            else:print('HealthUnlocked resource',url,code,'bytes',len(body),flush=True)
           except Exception as error:print('HealthUnlocked request failed',url,type(error).__name__,flush=True)
          PY
