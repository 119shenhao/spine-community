name: Verify first production Identity OAuth Secret provisioning (read-only)
on:
  push:
    branches: [main]
    paths:
      - scripts/provision-production-identity.mjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_D1_API_TOKEN }}
    steps:
      - name: Wait for Cloudflare main build and verify production D1 receipt without exposing secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          token=os.environ.get("CLOUDFLARE_API_TOKEN")
          if not token:raise SystemExit("Production D1 read token unavailable")
          account="289976272520a38732bef34108585e11"
          db="5919ff78-b8fc-46ab-85f0-01fe5e6a41b0"
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}"
          headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"}
          def get(path="",sql=None):
              body=json.dumps({"sql":sql}).encode() if sql else None
              with urlopen(Request(base+path,data=body,headers=headers),timeout=15) as r:
                  response=json.load(r)
              if not response.get("success"):raise RuntimeError("Cloudflare D1 query rejected")
              return response["result"]
          info=get()
          assert info.get("uuid")==db and info.get("name")=="spine-community-db","Wrong production D1 target"
          print("Exact production forum D1 target verified.")
          ok=False
          for attempt in range(1,25):
              try:
                  query=get("/query","SELECT key,value FROM settings WHERE key IN ('identity_center_prod_client_secret_digest','identity_center_prod_client_secret_verified')")
                  result=query[0]["results"]
                  values={x["key"]:x["value"] for x in result}
                  digest=values.get("identity_center_prod_client_secret_digest","")
                  verified=values.get("identity_center_prod_client_secret_verified","")
                  if re.fullmatch(r"[A-Za-z0-9_-]{43}",digest) and digest==verified:
                      ok=True
                      break
              except (HTTPError,URLError,KeyError,ValueError,IndexError):
                  pass
              if attempt<24:time.sleep(10)
          if not ok:
              raise SystemExit("Cloudflare main build has not produced a verified production client Secret receipt. Worker Editor/D1 build permissions may need admin attention.")
          print("PASS: Cloudflare production build recorded a matching verifier and completed Worker Secret upload.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Production Spine Worker Secret bootstrap verified through exact production D1 receipt; no plaintext secret exposed.\\n")
          PY
